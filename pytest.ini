[pytest]
# `pytest` sem argumentos tem de correr a MESMA coisa que `pytest tests/`.
#
# Antes disto não corria: a recolha varria o repositório inteiro, encontrava
# `scripts/test_cenario_bypass.py` (um guião de validação manual, não um teste)
# e a cópia dele publicada em `out/pi/`, e morria na recolha — «143 tests
# collected, 2 errors», sem correr um único teste. Quem lançasse `pytest` à
# raiz ficava a pensar que a suite estava partida; quem lançasse
# `pytest tests/ -q` via 143 a passar. Duas verdades para o mesmo comando é
# exatamente o género de coisa que se descobre na véspera.
testpaths = tests

# `out/` é a pasta de publicação (está no .gitignore, mas o pytest não lê o
# .gitignore) e `scripts/` tem guiões executáveis cujo nome começa por `test_`.
norecursedirs = out results models .git __pycache__ *.egg-info
