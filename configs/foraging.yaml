environment:
  arena_radius: 15.0
  classic_scenario: cooperative_perception
  dynamic_nest: true
  dynamic_obstacles: true
  forbidden_area: 2.2
  hunger_timer_max: 600
  max_steps: 500
  nest_radius: 1.5
  nest_velocity: 0.015
  num_agents: 20
  num_obstacles: 50
  obstacle_penalty: -2.0
  obstacle_radius: 0.2
  obstacle_velocity: 0.02
  progress_reward_factor: 50.0
  required_to_eat: 3
evolution:
  eval_episodes: 2
  mutation_rate: 0.1
  pop_size: 30
  sigma: 0.1
gnn_agent:
  hidden_dim: 64
physics:
  agent_radius: 0.15
  collision_penalty: -1.0
  communication_radius: 1.0
plotting:
  smoothing_window: 10
ppo:
  learning_rate: 0.0001
  log_interval: 2000
  net_arch: [256, 256]
  num_cpu: 8
  # n_steps × num_envs = buffer por ciclo de update
  # Com 160 envs virtuais (8 arenas × 20 agentes):
  #   64 × 160 = 10240 amostras; 10240/512×4 = 80 gradient steps por ciclo
  #   (default seria 2048×160/64×10 = 51200 — demasiado, causava overfitting)
  n_steps: 64
  batch_size: 512
  n_epochs: 4
  checkpoint_interval_min: 30  # guardar checkpoint a cada 30 min
rewards:
  energy_cost: -0.05
  food_collected: 100.0
  out_of_bounds: -10.0
  wall_penalty: -5.0
sac:
  buffer_size: 500000
  ent_coef: 0.1
  learning_rate: 0.0001
  log_interval: 2000
  net_arch: [256, 256]
  num_cpu: 8
  checkpoint_interval_min: 30
simulation:
  guillotine_threshold: -200
  max_steps: 500
  render_mode: rgb_array
visualization:
  speed_slider_default: 30
  speed_slider_max: 120
  speed_slider_min: 1
