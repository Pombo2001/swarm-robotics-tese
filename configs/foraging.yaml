# Configurações do Cenário de Foraging
simulation:
  max_steps: 1000             # Duração do episódio
  render_mode: "human"        # "human" para ver, "rgb_array" para treino rápido

environment:
  num_agents: 10              # Quantidade de robôs (N)
  arena_radius: 10.0          # Raio da arena
  nest_radius: 1.0            # Raio do ninho (centro)
  forbidden_area: 12.0        # Limite geográfico (penalização se passar)

physics:
  agent_radius: 0.15          # Tamanho do robô
  communication_radius: 2.0   # Raio de comunicação (GNN)
  collision_penalty: -0.5     # Penalização por colisão

rewards:
  food_collected: 1.0         # Recompensa por levar comida ao ninho
  out_of_bounds: -0.1         # Penalização por sair da área
  energy_cost: -0.01          # Custo por movimento